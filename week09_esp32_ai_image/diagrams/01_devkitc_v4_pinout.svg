<text x="30" y="44" font-size="26" fill="#1d2433" text-anchor="start" font-weight="bold" >ESP32-DevKitC V4 핀 배치와 9주차 사용 핀</text><text x="30" y="72" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal" >보드 윗면(모듈이 위, USB가 아래) 기준 · 핀 번호 = GPIO 번호 · 실제 보드 실크스크린과 꼭 대조하세요</text><rect x="535" y="110" width="230" height="806" rx="12" fill="#1f5f8b" stroke="#174a6d" stroke-width="2" /><rect x="570" y="124" width="160" height="40" rx="4" fill="#2b7bb5" stroke="none" stroke-width="1.5" /><text x="650.0" y="150" font-size="13" fill="#d8ecfa" text-anchor="middle" font-weight="normal" >안테나</text><rect x="570" y="168" width="160" height="110" rx="4" fill="#cfd6de" stroke="#9aa3b2" stroke-width="1.5" /><text x="650.0" y="215" font-size="14" fill="#1d2433" text-anchor="middle" font-weight="bold" >ESP32-WROOM-32</text><text x="650.0" y="237" font-size="12" fill="#5b6475" text-anchor="middle" font-weight="normal" >(Wi-Fi·BT 모듈)</text><circle cx="549" cy="220" r="8" fill="#d9b44a" stroke="#7a5d10" stroke-width="1.5"/><rect x="453" y="208" width="78" height="24" rx="12" fill="#c0392b" stroke="none" stroke-width="1.5" /><text x="492" y="225" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >3V3</text><circle cx="751" cy="220" r="8" fill="#d9b44a" stroke="#7a5d10" stroke-width="1.5"/><rect x="769" y="208" width="78" height="24" rx="12" fill="#3b3b3b" stroke="none" stroke-width="1.5" /><text x="808" y="225" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >GND</text><circle cx="549" cy="252" r="8" fill="#d9b44a" stroke="#7a5d10" stroke-width="1.5"/><rect x="453" y="240" width="78" height="24" rx="12" fill="#666" stroke="none" stroke-width="1.5" /><text x="492" y="257" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >EN</text><circle cx="751" cy="252" r="8" fill="#d9b44a" stroke="#7a5d10" stroke-width="1.5"/><rect x="769" y="240" width="78" height="24" rx="12" fill="#2f6fd6" stroke="none" stroke-width="1.5" /><text x="