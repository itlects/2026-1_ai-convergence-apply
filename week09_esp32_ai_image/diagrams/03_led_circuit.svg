<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1300" height="600" fill="#ffffff"/>
<text x="30" y="44" font-size="26" fill="#1d2433" text-anchor="start" font-weight="bold" >LED 회로 — 왜 저항이 필요할까?</text><text x="30" y="72" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal" >GPIO → 220Ω → LED(+) → LED(−) → GND  · LED 4개 모두 같은 구조</text><rect x="40" y="120" width="150" height="110" rx="10" fill="#1f5f8b" stroke="none" stroke-width="1.5" /><text x="115" y="165" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" >ESP32</text><text x="115" y="192" font-size="14" fill="#d8ecfa" text-anchor="middle" font-weight="normal" >GPIO32</text><text x="115" y="214" font-size="13" fill="#d8ecfa" text-anchor="middle" font-weight="normal" >(3.3V)</text><line x1="190" y1="175" x2="260" y2="175" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><polyline points="260,175 280.0,175 285.0,165 295.0,185 305.0,165 315.0,185 325.0,165 335.0,185 340.0,175 360,175" fill="none" stroke="#1d2433" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="310.0" y="157" font-size="15" fill="#1d2433" text-anchor="middle" font-weight="bold" >R = 220Ω</text><text x="310.0" y="205" font-size="12" fill="#5b6475" text-anchor="middle" font-weight="normal" >전류 제한</text><line x1="360" y1="175" x2="400" y2="175" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="400" y1="175" x2="415" y2="175" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><polygon points="415,161 415,189 440,175" fill="#e53935" stroke="#1d2433" stroke-width="2"/><line x1="440" y1="161" x2="440" y2="189" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="440" y1="175" x2="460" y2="175" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="426" y1="157" x2="436" y2="145" stroke="#e53935" stroke-width="2" stroke-linecap="round" /><polygon points="436,145 429,148 434,153" fill="#e53935"/><line x1="436" y1="157" x2="446" y2="145" stroke="#e53935" stroke-width="2" stroke-linecap="round" /><polygon points="446,145 439,148 444,153" fill="#e53935"/><text x="404" y="207" font-size="16" fill="#d64545" text-anchor="start" font-weight="bold" >+</text><text x="450" y="207" font-size="18" fill="#1d2433" text-anchor="start" font-weight="bold" >−</text><text x="430" y="137" font-size="14" fill="#1d2433" text-anchor="middle" font-weight="bold" >LED (빨강)</text><line x1="460" y1="175" x2="540" y2="175" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="540" y1="175" x2="540" y2="210" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="540" y1="210" x2="540" y2="220" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="524" y1="220" x2="556" y2="220" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="530" y1="226" x2="550" y2="226" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="536" y1="232" x2="544" y2="232" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><text x="540" y="252" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >GND</text><text x="300" y="280" font-size="14" fill="#d64545" text-anchor="start" font-weight="normal" >흐르는 전류 →</text><line x1="300" y1="290" x2="500" y2="290" stroke="#d64545" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs><rect x="40" y="330" width="560" height="134" rx="10" fill="#eef6ff" stroke="#9cc3ef" stroke-width="1.5" /><text x="56" y="360" font-size="15" fill="#1d2433" text-anchor="start" font-weight="bold" >옴의 법칙으로 전류 계산 (V = I × R)</text><text x="56" y="382" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >LED가 켜지면 양단 전압 ≈ 2.0V (빨강 기준, 파랑·흰색은 약 3V)</text><text x="56" y="404" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >저항에 걸리는 전압 = 3.3V − 2.0V = 1.3V</text><text x="56" y="426" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >전류 I = V ÷ R = 1.3V ÷ 220Ω ≈ 6mA   ✔ 안전 (GPIO 권장 20mA 이하)</text><text x="56" y="448" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >저항이 없으면? → 전류가 크게 흘러 LED·GPIO가 손상될 수 있음</text><path d="M782,210 L782,160 A38,38 0 0 1 858,160 L858,210 Z" fill="#e53935" opacity="0.85" stroke="#8b1d1d" stroke-width="2"/><rect x="774" y="210" width="92" height="12" rx="3" fill="#c62828" stroke="none" stroke-width="1.5" /><line x1="806" y1="222" x2="806" y2="370" stroke="#888" stroke-width="5" stroke-linecap="round" /><line x1="834" y1="222" x2="834" y2="330" stroke="#888" stroke-width="5" stroke-linecap="round" /><text x="794" y="400" font-size="14" fill="#d64545" text-anchor="end" font-weight="bold" >긴 다리 = 애노드(+)</text><text x="846" y="360" font-size="14" fill="#1d2433" text-anchor="start" font-weight="bold" >짧은 다리 = 캐소드(−)</text><text x="870" y="218" font-size="13" fill="#5b6475" text-anchor="start" font-weight="normal" >← 테두리가 평평한 쪽 = (−)</text><text x="820" y="110" font-size="16" fill="#1d2433" text-anchor="middle" font-weight="bold" >LED 실물 — 방향이 있다 (극성)</text><line x1="940" y1="470" x2="1160" y2="470" stroke="#888" stroke-width="4" stroke-linecap="round" /><rect x="1000" y="454" width="100" height="32" rx="12" fill="#e8d3a6" stroke="#a8875a" stroke-width="1.5" /><rect x="1014" y="454" width="8" height="32" rx="1" fill="#d32f2f" stroke="none" stroke-width="1.5" /><rect x="1034" y="454" width="8" height="32" rx="1" fill="#d32f2f" stroke="none" stroke-width="1.5" /><rect x="1054" y="454" width="8" height="32" rx="1" fill="#5d4037" stroke="none" stroke-width="1.5" /><rect x="1084" y="454" width="8" height="32" rx="1" fill="#c9a227" stroke="none" stroke-width="1.5" /><text x="1050" y="440" font-size="14" fill="#1d2433" text-anchor="middle" font-weight="bold" >220Ω 저항 색띠: 빨 빨 갈 (금)</text><text x="1050" y="514" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >방향 없음 (어느 쪽이든 OK)</text>
</svg>