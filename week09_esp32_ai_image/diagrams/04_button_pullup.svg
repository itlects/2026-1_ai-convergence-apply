<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1300" height="640" fill="#ffffff"/>
<text x="30" y="44" font-size="26" fill="#1d2433" text-anchor="start" font-weight="bold" >버튼 회로 — 내부 풀업(INPUT_PULLUP)</text><text x="30" y="72" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal" >외부 저항 없이 GPIO ↔ 버튼 ↔ GND 만 연결한다 · 버튼 4개 모두 같은 구조</text><rect x="40" y="110" width="430" height="330" rx="14" fill="#eaf2fb" stroke="#1f5f8b" stroke-width="2" stroke-dasharray="8 6"/><text x="60" y="140" font-size="15" fill="#1f5f8b" text-anchor="start" font-weight="bold" >ESP32 칩 내부</text><text x="120" y="185" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold" >3.3V</text><line x1="120" y1="192" x2="120" y2="210" stroke="#c0392b" stroke-width="3" stroke-linecap="round" /><polyline points="120,210 120,228.0 110,232.5 130,241.5 110,250.5 130,259.5 110,268.5 130,277.5 120,282.0 120,300" fill="none" stroke="#1d2433" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="138" y="260.0" font-size="14" fill="#1d2433" text-anchor="start" font-weight="bold" >내부 풀업 ≈ 45kΩ</text><line x1="120" y1="300" x2="120" y2="340" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><circle cx="120" cy="340" r="5" fill="#1d2433"/><line x1="120" y1="340" x2="470" y2="340" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="120" y1="340" x2="120" y2="380" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><rect x="60" y="380" width="120" height="40" rx="6" fill="#fff" stroke="#1d2433" stroke-width="1.5" /><text x="120" y="406" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >입력 판독기</text><text x="250" y="330" font-size="14" fill="#2f6fd6" text-anchor="start" font-weight="bold" >GPIO23 핀</text><circle cx="470" cy="340" r="9" fill="#d9b44a" stroke="#7a5d10" stroke-width="1.5"/><line x1="470" y1="340" x2="560" y2="340" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="560" y1="340" x2="578" y2="340" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="612" y1="340" x2="630" y2="340" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><circle cx="580" cy="340" r="4" fill="#fff" stroke="#1d2433" stroke-width="2"/><circle cx="610" cy="340" r="4" fill="#fff" stroke="#1d2433" stroke-width="2"/><line x1="574" y1="326" x2="616" y2="326" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="595" y1="326" x2="595" y2="312" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="586" y1="312" x2="604" y2="312" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><text x="595" y="302" font-size="14" fill="#1d2433" text-anchor="middle" font-weight="bold" >택트 스위치</text><line x1="630" y1="340" x2="700" y2="340" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="700" y1="340" x2="700" y2="350" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="684" y1="350" x2="716" y2="350" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="690" y1="356" x2="710" y2="356" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="696" y1="362" x2="704" y2="362" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><text x="700" y="382" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >GND</text><rect x="800" y="120" width="460" height="200" rx="12" fill="#f3f5f9" stroke="none" stroke-width="1.5" /><text x="820" y="154" font-size="15" fill="#1d2433" text-anchor="start" font-weight="bold" >버튼 상태</text><text x="980" y="154" font-size="15" fill="#1d2433" text-anchor="start" font-weight="bold" >핀 전압</text><text x="1110" y="154" font-size="15" fill="#1d2433" text-anchor="start" font-weight="bold" >digitalRead()</text><line x1="815" y1="168" x2="1245" y2="168" stroke="#8a93a6" stroke-width="1" stroke-linecap="round" /><text x="820" y="208" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >안 누름 (열림)</text><text x="980" y="208" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >3.3V (풀업)</text><text x="1110" y="208" font-size="16" fill="#5b6475" text-anchor="start" font-weight="bold" >HIGH = 1</text><text x="820" y="260" font-size="15" fill="#2f6fd6" text-anchor="start" font-weight="bold" >누름 (닫힘)</text><text x="980" y="260" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >0V (GND)</text><text x="1110" y="260" font-size="16" fill="#2f6fd6" text-anchor="start" font-weight="bold" >LOW = 0</text><text x="820" y="302" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold" >→ 코드에서 '눌림'은  digitalRead(pin) == LOW</text><rect x="800" y="350" width="460" height="112" rx="10" fill="#fff8e1" stroke="#f0c36d" stroke-width="1.5" /><text x="816" y="380" font-size="15" fill="#1d2433" text-anchor="start" font-weight="bold" >왜 풀업이 필요할까?</text><text x="816" y="402" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >풀업이 없으면 버튼을 뗐을 때 핀이 공중에 떠서(floating)</text><text x="816" y="424" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >0과 1이 무작위로 읽힌다 → 오동작</text><text x="816" y="446" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO34~39 는 내부 풀업이 없어 이번 회로에 쓰면 안 됨</text><rect x="120" y="500" width="90" height="90" rx="6" fill="#444" stroke="none" stroke-width="1.5" /><circle cx="165" cy="545" r="26" fill="#222" stroke="#666" stroke-width="3"/><rect x="104" y="508" width="12" height="8" rx="2" fill="#aaa" stroke="none" stroke-width="1.5" /><rect x="104" y="574" width="12" height="8" rx="2" fill="#aaa" stroke="none" stroke-width="1.5" /><rect x="214" y="508" width="12" height="8" rx="2" fill="#aaa" stroke="none" stroke-width="1.5" /><rect x="214" y="574" width="12" height="8" rx="2" fill="#aaa" stroke="none" stroke-width="1.5" /><line x1="104" y1="512" x2="104" y2="578" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="226" y1="512" x2="226" y2="578" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/><text x="260" y="530" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >택트 스위치 4다리: 같은 쪽 위·아래 다리는 항상 연결(점선)</text><text x="260" y="556" font-size="14" fill="#2f6fd6" text-anchor="start" font-weight="bold" >→ 대각선 위치의 두 다리를 사용하면 방향 실수가 없다</text><text x="260" y="582" font-size="14" fill="#5b6475" text-anchor="start" font-weight="normal" >브레드보드 가운데 홈을 걸쳐 꽂는다</text>
</svg>