<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1400" height="560" fill="#ffffff"/>
<text x="30" y="44" font-size="26" fill="#1d2433" text-anchor="start" font-weight="bold" >사진 한 장이 SD 카드 파일이 되기까지</text><text x="30" y="72" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal" >esp_camera_fb_get() → File.write() → esp_camera_fb_return()</text><rect x="40" y="140" width="200" height="170" rx="14" fill="#fff7d6" stroke="#e0b400" stroke-width="2.5" /><circle cx="64" cy="164" r="14" fill="#e0b400"/><text x="64" y="169" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >1</text><text x="140.0" y="210" font-size="18" fill="#e0b400" text-anchor="middle" font-weight="bold" >빛</text><text x="140.0" y="245" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >피사체에서 반사된 빛이</text><text x="140.0" y="269" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >렌즈로 들어온다</text><polygon points="244,215 262,225 244,235" fill="#8a93a6"/><rect x="266" y="140" width="200" height="170" rx="14" fill="#e6f6f6" stroke="#0f8b8d" stroke-width="2.5" /><circle cx="290" cy="164" r="14" fill="#0f8b8d"/><text x="290" y="169" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >2</text><text x="366.0" y="210" font-size="18" fill="#0f8b8d" text-anchor="middle" font-weight="bold" >이미지 센서</text><text x="366.0" y="245" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >수만 개 픽셀이 빛의 양을</text><text x="366.0" y="269" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >전기 신호(숫자)로 변환</text><polygon points="470,215 488,225 470,235" fill="#8a93a6"/><rect x="492" y="140" width="200" height="170" rx="14" fill="#e6f6f6" stroke="#0f8b8d" stroke-width="2.5" /><circle cx="516" cy="164" r="14" fill="#0f8b8d"/><text x="516" y="169" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >3</text><text x="592.0" y="210" font-size="18" fill="#0f8b8d" text-anchor="middle" font-weight="bold" >JPEG 압축</text><text x="592.0" y="245" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >카메라 칩이 압축</text><text x="592.0" y="269" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >320×240 ≈ 5~15KB</text><polygon points="696,215 714,225 696,235" fill="#8a93a6"/><rect x="718" y="140" width="200" height="170" rx="14" fill="#fff1d0" stroke="#d18a00" stroke-width="2.5" /><circle cx="742" cy="164" r="14" fill="#d18a00"/><text x="742" y="169" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >4</text><text x="818.0" y="210" font-size="18" fill="#d18a00" text-anchor="middle" font-weight="bold" >프레임 버퍼</text><text x="818.0" y="245" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >PSRAM에 저장</text><text x="818.0" y="269" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >camera_fb_t (buf,len,w,h)</text><polygon points="922,215 940,225 922,235" fill="#8a93a6"/><rect x="944" y="140" width="200" height="170" rx="14" fill="#f1ebfd" stroke="#7b4fd6" stroke-width="2.5" /><circle cx="968" cy="164" r="14" fill="#7b4fd6"/><text x="968" y="169" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >5</text><text x="1044.0" y="210" font-size="18" fill="#7b4fd6" text-anchor="middle" font-weight="bold" >microSD 파일</text><text x="1044.0" y="245" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >/photos/IMG_0001.jpg</text><text x="1044.0" y="269" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >File.write(buf, len)</text><polygon points="1148,215 1166,225 1148,235" fill="#8a93a6"/><rect x="1170" y="140" width="200" height="170" rx="14" fill="#eaf2fb" stroke="#1f5f8b" stroke-width="2.5" /><circle cx="1194" cy="164" r="14" fill="#1f5f8b"/><text x="1194" y="169" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >6</text><text x="1270.0" y="210" font-size="18" fill="#1f5f8b" text-anchor="middle" font-weight="bold" >PC · Colab · 웹</text><text x="1270.0" y="245" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >특성 확인·96×96 변환</text><text x="1270.0" y="269" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >갤러리 표시</text><rect x="40" y="350" width="1320" height="180" rx="12" fill="#f3f5f9" stroke="none" stroke-width="1.5" /><text x="70" y="390" font-size="16" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, monospace">esp_camera_init(&config)</text><text x="560" y="390" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >카메라 핀·해상도·JPEG 품질 설정 (setup에서 1회)</text><text x="70" y="426" font-size="16" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, monospace">camera_fb_t *fb = esp_camera_fb_get()</text><text x="560" y="426" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >프레임 1장 받기 (fb->buf: JPEG 바이트, fb->len: 크기)</text><text x="70" y="462" font-size="16" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, monospace">file.write(fb->buf, fb->len)</text><text x="560" y="462" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >JPEG 바이트를 그대로 SD 파일에 기록</text><text x="70" y="498" font-size="16" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, monospace">esp_camera_fb_return(fb)</text><text x="560" y="498" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >버퍼 반납 — 빠뜨리면 다음 촬영이 멈춘다!</text>
</svg>