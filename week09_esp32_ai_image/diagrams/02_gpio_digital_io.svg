<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1300" height="560" fill="#ffffff"/>
<text x="30" y="44" font-size="26" fill="#1d2433" text-anchor="start" font-weight="bold" >GPIO = 범용 디지털 입·출력 핀</text><text x="30" y="72" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal" >디지털 신호는 두 가지 상태만 있다 : HIGH(1, 3.3V) / LOW(0, 0V)</text><rect x="30" y="100" width="600" height="420" rx="14" fill="#f3f5f9" stroke="none" stroke-width="1.5" /><text x="60" y="140" font-size="18" fill="#1d2433" text-anchor="start" font-weight="bold" >① 출력 (OUTPUT) — ESP32가 전압을 내보낸다</text><rect x="60" y="170" width="140" height="90" rx="10" fill="#1f5f8b" stroke="none" stroke-width="1.5" /><text x="130" y="205" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" >ESP32</text><text x="130" y="232" font-size="14" fill="#d8ecfa" text-anchor="middle" font-weight="normal" >GPIO32</text><line x1="200" y1="215" x2="260" y2="215" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><polyline points="260,215 276.0,215 280.0,205 288.0,225 296.0,205 304.0,225 312.0,205 320.0,225 324.0,215 340,215" fill="none" stroke="#1d2433" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="300.0" y="197" font-size="15" fill="#1d2433" text-anchor="middle" font-weight="bold" >220Ω</text><line x1="340" y1="215" x2="355" y2="215" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><polygon points="355,201 355,229 380,215" fill="#e53935" stroke="#1d2433" stroke-width="2"/><line x1="380" y1="201" x2="380" y2="229" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="380" y1="215" x2="400" y2="215" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="366" y1="197" x2="376" y2="185" stroke="#e53935" stroke-width="2" stroke-linecap="round" /><polygon points="376,185 369,188 374,193" fill="#e53935"/><line x1="376" y1="197" x2="386" y2="185" stroke="#e53935" stroke-width="2" stroke-linecap="round" /><polygon points="386,185 379,188 384,193" fill="#e53935"/><text x="344" y="247" font-size="16" fill="#d64545" text-anchor="start" font-weight="bold" >+</text><text x="390" y="247" font-size="18" fill="#1d2433" text-anchor="start" font-weight="bold" >−</text><text x="370" y="177" font-size="14" fill="#1d2433" text-anchor="middle" font-weight="bold" >LED</text><line x1="400" y1="215" x2="440" y2="215" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="440" y1="215" x2="440" y2="225" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="424" y1="225" x2="456" y2="225" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="430" y1="231" x2="450" y2="231" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="436" y1="237" x2="444" y2="237" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><text x="440" y="257" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >GND</text><text x="60" y="320" font-size="16" fill="#2e9e5b" text-anchor="start" font-weight="bold" font-family="monospace">digitalWrite(32, HIGH);</text><text x="330" y="320" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >→ 3.3V 출력 → 전류가 흘러 LED 켜짐</text><text x="60" y="352" font-size="16" fill="#5b6475" text-anchor="start" font-weight="bold" font-family="monospace">digitalWrite(32, LOW);</text><text x="330" y="352" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >→ 0V 출력 → 전류 없음 → LED 꺼짐</text><polyline points="80,470 160,470 160,410 300,410 300,470 380,470 380,410 520,410 520,470 590,470" fill="none" stroke="#2e9e5b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="70" y="415" font-size="12" fill="#5b6475" text-anchor="end" font-weight="normal" >3.3V</text><text x="70" y="475" font-size="12" fill="#5b6475" text-anchor="end" font-weight="normal" >0V</text><text x="230" y="400" font-size="13" fill="#2e9e5b" text-anchor="middle" font-weight="normal" >HIGH(켜짐)</text><text x="120" y="460" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >LOW</text><rect x="670" y="100" width="600" height="420" rx="14" fill="#f3f5f9" stroke="none" stroke-width="1.5" /><text x="700" y="140" font-size="18" fill="#1d2433" text-anchor="start" font-weight="bold" >② 입력 (INPUT_PULLUP) — 핀의 전압을 읽는다</text><rect x="700" y="170" width="140" height="90" rx="10" fill="#1f5f8b" stroke="none" stroke-width="1.5" /><text x="770" y="205" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" >ESP32</text><text x="770" y="232" font-size="14" fill="#d8ecfa" text-anchor="middle" font-weight="normal" >GPIO23</text><line x1="840" y1="215" x2="900" y2="215" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="900" y1="215" x2="918" y2="215" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="952" y1="215" x2="970" y2="215" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><circle cx="920" cy="215" r="4" fill="#fff" stroke="#1d2433" stroke-width="2"/><circle cx="950" cy="215" r="4" fill="#fff" stroke="#1d2433" stroke-width="2"/><line x1="914" y1="201" x2="956" y2="201" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="935" y1="201" x2="935" y2="187" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="926" y1="187" x2="944" y2="187" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><text x="935" y="177" font-size="14" fill="#1d2433" text-anchor="middle" font-weight="bold" >버튼</text><line x1="970" y1="215" x2="1010" y2="215" stroke="#1d2433" stroke-width="3" stroke-linecap="round" /><line x1="1010" y1="215" x2="1010" y2="225" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="994" y1="225" x2="1026" y2="225" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="1000" y1="231" x2="1020" y2="231" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="1006" y1="237" x2="1014" y2="237" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><text x="1010" y="257" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >GND</text><text x="700" y="320" font-size="16" fill="#2f6fd6" text-anchor="start" font-weight="bold" font-family="monospace">digitalRead(23)</text><text x="700" y="352" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >안 누름 → 내부 풀업 때문에 HIGH(1)</text><text x="700" y="380" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >누름     → GND와 연결되어 LOW(0)</text><polyline points="720,410 820,410 820,470 960,470 960,410 1040,410 1040,470 1160,470 1160,410 1240,410" fill="none" stroke="#2f6fd6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="890" y="460" font-size="13" fill="#2f6fd6" text-anchor="middle" font-weight="normal" >누름 = 0</text><text x="1100" y="400" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >안 누름 = 1</text>
</svg>