<text x="30" y="44" font-size="26" fill="#1d2433" text-anchor="start" font-weight="bold" >이미지 갤러리 웹 앱 구조 (예제 8)</text><text x="30" y="72" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal" >ESP32-S3 = Wi-Fi 공유기(AP) + 웹서버 · 스마트폰/노트북 브라우저 = 화면(앱)</text><rect x="40" y="120" width="380" height="420" rx="16" fill="#eaf2fb" stroke="#1f5f8b" stroke-width="2" /><text x="230" y="156" font-size="17" fill="#1f5f8b" text-anchor="middle" font-weight="bold" >스마트폰 / 노트북 브라우저</text><rect x="80" y="180" width="300" height="230" rx="10" fill="#fff" stroke="#9aa3b2" stroke-width="1.5" /><rect x="96" y="200" width="80" height="64" rx="4" fill="#9fd3c7" stroke="none" stroke-width="1.5" /><text x="136" y="282" font-size="10" fill="#5b6475" text-anchor="middle" font-weight="normal" >IMG_0001</text><rect x="190" y="200" width="80" height="64" rx="4" fill="#f6c38b" stroke="none" stroke-width="1.5" /><text x="230" y="282" font-size="10" fill="#5b6475" text-anchor="middle" font-weight="normal" >IMG_0002</text><rect x="284" y="200" width="80" height="64" rx="4" fill="#c3b1e1" stroke="none" stroke-width="1.5" /><text x="324" y="282" font-size="10" fill="#5b6475" text-anchor="middle" font-weight="normal" >IMG_0003</text><rect x="96" y="300" width="80" height="64" rx="4" fill="#a8d5ff" stroke="none" stroke-width="1.5" /><text x="136" y="382" font-size="10" fill="#5b6475" text-anchor="middle" font-weight="normal" >IMG_0004</text><rect x="190" y="300" width="80" height="64" rx="4" fill="#f7a8a8" stroke="none" stroke-width="1.5" /><text x="230" y="382" font-size="10" fill="#5b6475" text-anchor="middle" font-weight="normal" >IMG_0005</text><rect x="284" y="300" width="80" height="64" rx="4" fill="#cde7a8" stroke="none" stroke-width="1.5" /><text x="324" y="382" font-size="10" fill="#5b6475" text-anchor="middle" font-weight="normal" >IMG_0006</text><text x="230" y="440" font-size="14" fill="#1d2433" text-anchor="middle" font-weight="bold" >갤러리 HTML + JavaScript</text><text x="230" y="466" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >canvas로 96×96 변환·PNG 저장</text><text x="230" y="500" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold" >접속: http://192.168.4.1</text><text x="620" y="250" font-size="15" fill="#5b6475" text-anchor="middle" font-weight="normal" >Wi-Fi 연결</text><text x="620" y="274" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >W09-CAM-xxxx / 12345678</text><line x1="440" y1="310" x2="800" y2="310" stroke="#1f5f8b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2)"/><text x="450" y="302" font-size="13" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, monospace">GET /</text><text x="770" y="302" font-size="13" fill="#5b6475" text-anchor="end" font-weight="normal" >갤러리 페이지(HTML)</text><line x1="440" y1="354" x2="800" y2="354" stroke="#1f5f8b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2)"/><text x="450" y="346" font-size="13" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, monospace">GET /list</text><text x="770" y="346" font-size="13" fill="#5b6475" text-anchor="end" font-weight="normal" >사진 목록 JSON</text><line x1="440" y1="398" x2="800" y2="398" stroke="#1f5f8b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2)"/><text x="450" y="390" font-size="13" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, monospace">GET /photo?n=IMG_0001.jpg</text><text x="770" y="390" font-size="13" fill="#5b6475" text-anchor="end" font-weight="normal" >JPEG 1장</text><line x1="440" y1="442" x2="800" y2="442" stroke="#1f5f8b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2)"/><text x="450" y="434" font-size="13" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, monospace">GET /capture</text><text x="770" y="434" font-size="13" fill="#5b6475" text-anchor="end" font-weight="normal" >촬영→저장→결과 JSON</text><line x1="440" y1="486" x2="800" y2="486" stroke="#1f5f8b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2)"/><text x="450" y="478" font-size="13" fill="#1f5f8b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, monospace">GET /delete?n=...</text><text x="770" y="478" font-size="13" fill="#5b6475" text-anchor="end" font-weight="normal" >사진 삭제</text><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/></marker></defs><rect x="820" y="120" width="330" height="420" rx="16" fill="#1f5f8b" stroke="#174a6d" stroke-width="2" /><text x="985" y="160" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >ESP32-S3 (예제 8)</text><text x="840" y="210" font-size="14" fill="#e6f1fb" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, monospace">WiFi.softAP()  → 공유기 역할</text><text x="840" y="244" font-size="14" fill="#e6f1fb" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, monospace">WebServer server(80)</text><text x="840" y="278" font-size="14" fill="#e6f1fb" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, monospace">server.on("/list", ...)</text><text x="840" y="312" font-size="14" fill="#e6f1fb" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, monospace">server.streamFile(jpg)</text><text x="840" y="346" font-size="14" fill="#e6f1fb" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, monospace">capturePhoto()</text><text x="840" y="380" font-size="14" fill="#e6f1fb" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, monospace">server.handleClient()  (loop)</text><rect x="1210" y="160" width="270" height="140" rx="14" fill="#e6f6f6" stroke="#0f8b8d" stroke-width="2" /><text x="1345" y="220" font-size="18" fill="#0f8b8d" text-anchor="middle" font-weight="bold" >카메라</text><text x="1345" y="250" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >esp_camera_fb_get()</text><rect x="1210" y="360" width="270" height="140" rx="14" fill="#f1ebfd" stroke="#7b4fd6" stroke-width="2" /><text x="1345" y="420" font-size="18" fill="#7b4fd6" text-anchor="middle" font-weight="bold" >microSD /photos</text><text x="1345" y="450" font-size="13" fill="#1d2433" text-anchor="middle" font-weight="normal" >SD_MMC.open / remove</text><line x1="1150" y1="230" x2="1210" y2="230" stroke="#0f8b8d" stroke-width="4" stroke-linecap="round" /><line x1="1150" y1="430" x2="1210" y2="430" stroke="#7b4fd6" stroke-width="4" stroke-linecap="round" /><text x="40" y="590" font-size="14" fill="#5b6475" text-anchor="start" font-weight="normal" >Wi-Fi 공유기 없이 수업 가능 · 사진은 SD에 남으므로 카드를 빼서 PC로 복사해 Colab 워크북 3에 올린다</text>
</svg>