<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1400" height="900" fill="#ffffff"/>
<text x="30" y="44" font-size="26" fill="#1d2433" text-anchor="start" font-weight="bold" >ESP32-S3-WROOM CAM 보드 구조 (카메라·microSD 실습용)</text><text x="30" y="72" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal" >카메라·SD 슬롯은 보드 안에서 이미 연결되어 있다 → 학생은 USB 케이블과 SD 카드만 준비</text><rect x="520" y="250" width="360" height="380" rx="14" fill="#1f5f8b" stroke="#174a6d" stroke-width="2" /><text x="700.0" y="290" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold" >ESP32-S3-WROOM-1</text><text x="700.0" y="316" font-size="13" fill="#d8ecfa" text-anchor="middle" font-weight="normal" >듀얼코어 240MHz · Wi-Fi · BLE</text><rect x="550" y="340" width="300" height="60" rx="8" fill="#2b7bb5" stroke="none" stroke-width="1.5" /><text x="700.0" y="366" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >플래시 8MB / 16MB</text><text x="700.0" y="388" font-size="12" fill="#d8ecfa" text-anchor="middle" font-weight="normal" >프로그램 저장</text><rect x="550" y="415" width="300" height="70" rx="8" fill="#ffb703" stroke="none" stroke-width="1.5" /><text x="700.0" y="444" font-size="15" fill="#1d2433" text-anchor="middle" font-weight="bold" >PSRAM 8MB (OPI)</text><text x="700.0" y="468" font-size="12" fill="#1d2433" text-anchor="middle" font-weight="normal" >사진 프레임 버퍼 저장 · GPIO35~37 사용</text><rect x="550" y="500" width="300" height="50" rx="8" fill="#2b7bb5" stroke="none" stroke-width="1.5" /><text x="700.0" y="531" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >LCD_CAM 주변장치 (카메라 입력)</text><rect x="550" y="562" width="300" height="50" rx="8" fill="#2b7bb5" stroke="none" stroke-width="1.5" /><text x="700.0" y="593" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >SDMMC 주변장치 (SD 카드)</text><rect x="60" y="160" width="400" height="330" rx="14" fill="#e6f6f6" stroke="#0f8b8d" stroke-width="2" /><text x="260" y="194" font-size="16" fill="#0f8b8d" text-anchor="middle" font-weight="bold" >카메라 OV2640 (또는 OV3660)</text><circle cx="130" cy="255" r="34" fill="#222"/><circle cx="130" cy="255" r="16" fill="#3a5f8a"/><text x="180" y="250" font-size="13" fill="#1d2433" text-anchor="start" font-weight="normal" >24핀 FPC 리본</text><text x="180" y="270" font-size="13" fill="#1d2433" text-anchor="start" font-weight="normal" >커넥터로 연결</text><text x="76" y="320" font-size="13" fill="#0f8b8d" text-anchor="start" font-weight="bold" >XCLK</text><text x="170" y="320" font-size="13" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO15</text><text x="448" y="320" font-size="12" fill="#5b6475" text-anchor="end" font-weight="normal" >카메라 클록 20MHz</text><text x="76" y="342" font-size="13" fill="#0f8b8d" text-anchor="start" font-weight="bold" >SIOD/SDA</text><text x="170" y="342" font-size="13" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO4</text><text x="448" y="342" font-size="12" fill="#5b6475" text-anchor="end" font-weight="normal" >설정용 I²C(SCCB)</text><text x="76" y="364" font-size="13" fill="#0f8b8d" text-anchor="start" font-weight="bold" >SIOC/SCL</text><text x="170" y="364" font-size="13" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO5</text><text x="448" y="364" font-size="12" fill="#5b6475" text-anchor="end" font-weight="normal" ></text><text x="76" y="386" font-size="13" fill="#0f8b8d" text-anchor="start" font-weight="bold" >VSYNC</text><text x="170" y="386" font-size="13" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO6</text><text x="448" y="386" font-size="12" fill="#5b6475" text-anchor="end" font-weight="normal" >프레임 시작</text><text x="76" y="408" font-size="13" fill="#0f8b8d" text-anchor="start" font-weight="bold" >HREF</text><text x="170" y="408" font-size="13" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO7</text><text x="448" y="408" font-size="12" fill="#5b6475" text-anchor="end" font-weight="normal" >줄 유효</text><text x="76" y="430" font-size="13" fill="#0f8b8d" text-anchor="start" font-weight="bold" >PCLK</text><text x="170" y="430" font-size="13" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO13</text><text x="448" y="430" font-size="12" fill="#5b6475" text-anchor="end" font-weight="normal" >픽셀 클록</text><text x="76" y="452" font-size="13" fill="#0f8b8d" text-anchor="start" font-weight="bold" >Y2~Y9</text><text x="170" y="452" font-size="13" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO11,9,8,10,12,18,17,16</text><text x="448" y="452" font-size="12" fill="#5b6475" text-anchor="end" font-weight="normal" >8비트 데이터</text><polyline points="460,410 520,525" fill="none" stroke="#0f8b8d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="480" y="395" font-size="13" fill="#0f8b8d" text-anchor="middle" font-weight="bold" >DVP 8비트</text><rect x="1000" y="160" width="340" height="200" rx="14" fill="#f1ebfd" stroke="#7b4fd6" stroke-width="2" /><text x="1170" y="194" font-size="16" fill="#7b4fd6" text-anchor="middle" font-weight="bold" >microSD 슬롯 (보드 뒷면)</text><rect x="1024" y="214" width="70" height="90" rx="6" fill="#333" stroke="none" stroke-width="1.5" /><text x="1059" y="264" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" >SD</text><text x="1120" y="240" font-size="15" fill="#7b4fd6" text-anchor="start" font-weight="bold" >CMD</text><text x="1180" y="240" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO38</text><text x="1120" y="266" font-size="15" fill="#7b4fd6" text-anchor="start" font-weight="bold" >CLK</text><text x="1180" y="266" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO39</text><text x="1120" y="292" font-size="15" fill="#7b4fd6" text-anchor="start" font-weight="bold" >D0</text><text x="1180" y="292" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >GPIO40</text><text x="1024" y="340" font-size="13" fill="#5b6475" text-anchor="start" font-weight="normal" >1비트 SDMMC 모드 · FAT32 · 32GB 이하 권장</text><polyline points="1000,280 880,587" fill="none" stroke="#7b4fd6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="1000" y="420" width="340" height="210" rx="14" fill="#fdf0e6" stroke="#e08a1e" stroke-width="2" /><text x="1170" y="454" font-size="16" fill="#e08a1e" text-anchor="middle" font-weight="bold" >USB-C 포트 2개</text><text x="1020" y="490" font-size="14" fill="#1d2433" text-anchor="start" font-weight="bold" >COM / UART 포트 (CH343 변환칩)</text><text x="1020" y="512" font-size="13" fill="#5b6475" text-anchor="start" font-weight="normal" >→ 업로드·시리얼 모니터 권장 포트</text><text x="1020" y="532" font-size="13" fill="#e08a1e" text-anchor="start" font-weight="normal" >→ 'USB CDC On Boot: Disabled'</text><text x="1020" y="566" font-size="14" fill="#1d2433" text-anchor="start" font-weight="bold" >USB / OTG 포트 (S3 내장 USB, GPIO19·20)</text><text x="1020" y="588" font-size="13" fill="#e08a1e" text-anchor="start" font-weight="normal" >→ 이 포트를 쓰면 'USB CDC On Boot: Enabled'</text><polyline points="1000,525 880,450" fill="none" stroke="#e08a1e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><rect x="60" y="560" width="400" height="120" rx="14" fill="#f3f5f9" stroke="#8a93a6" stroke-width="1.5" /><text x="80" y="594" font-size="15" fill="#1d2433" text-anchor="start" font-weight="bold" >BOOT 버튼 = GPIO0</text><text x="80" y="618" font-size="13" fill="#5b6475" text-anchor="start" font-weight="normal" >예제7·8에서 '촬영 버튼'으로 사용</text><text x="80" y="650" font-size="15" fill="#1d2433" text-anchor="start" font-weight="bold" >RST(EN) 버튼 = 리셋</text><polyline points="460,600 520,590" fill="none" stroke="#8a93a6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="60" y="720" width="1280" height="68" rx="10" fill="#eef6ff" stroke="#9cc3ef" stroke-width="1.5" /><text x="76" y="750" font-size="16" fill="#1d2433" text-anchor="start" font-weight="bold" >Arduino IDE 도구 메뉴 설정 (PSRAM을 켜지 않으면 카메라 초기화 실패 또는 저해상도만 가능)</text><text x="76" y="772" font-size="15" fill="#1d2433" text-anchor="start" font-weight="normal" >보드: ESP32S3 Dev Module · PSRAM: OPI PSRAM (꼭!) · Flash: 8MB(N8R8)/16MB(N16R8) · Partition: 8M with spiffs(3MB APP) · 업로드 속도 921600</text><text x="60" y="870" font-size="13" fill="#5b6475" text-anchor="start" font-weight="normal" >※ Freenove ESP32-S3-WROOM CAM 및 호환 보드 기준 (카메라 핀 = ESP32-S3-EYE 배치). 다른 제조사 보드는 보드 설명서의 핀 표로 코드 상단 #define 값을 바꾼다.</text>
</svg>