<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1300" height="560" fill="#ffffff"/>
<text x="30" y="44" font-size="26" fill="#1d2433" text-anchor="start" font-weight="bold" >부저 회로 — tone()으로 음 높이 만들기</text><text x="30" y="72" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal" >GPIO27 → 부저(+), 부저(−) → GND · 수동(패시브) 부저 사용</text><rect x="40" y="120" width="150" height="100" rx="10" fill="#1f5f8b" stroke="none" stroke-width="1.5" /><text x="115" y="162" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" >ESP32</text><text x="115" y="190" font-size="14" fill="#d8ecfa" text-anchor="middle" font-weight="normal" >GPIO27</text><polyline points="190,170 300,170 300,290 348,290 348,268" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M334,240 A26,26 0 0 1 386,240 Z" fill="#fff3e0" stroke="#1d2433" stroke-width="2.5"/><line x1="348" y1="240" x2="348" y2="268" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="372" y1="240" x2="372" y2="268" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><text x="338" y="264" font-size="15" fill="#d64545" text-anchor="start" font-weight="bold" >+</text><text x="360" y="206" font-size="14" fill="#1d2433" text-anchor="middle" font-weight="bold" >부저</text><polyline points="372,268 372,290 430,290 430,300" fill="none" stroke="#1d2433" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="430" y1="300" x2="430" y2="310" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="414" y1="310" x2="446" y2="310" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="420" y1="316" x2="440" y2="316" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><line x1="426" y1="322" x2="434" y2="322" stroke="#1d2433" stroke-width="2.5" stroke-linecap="round" /><text x="430" y="342" font-size="13" fill="#5b6475" text-anchor="middle" font-weight="normal" >GND</text><rect x="450" y="110" width="380" height="156" rx="10" fill="#fff8e1" stroke="#f0c36d" stroke-width="1.5" /><text x="466" y="140" font-size="15" fill="#1d2433" text-anchor="start" font-weight="bold" >부저 종류</text><text x="466" y="162" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >수동 부저: 주는 신호의 주파수대로 소리</text><text x="466" y="184" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >  → tone()으로 도레미 연주 가능 ✔</text><text x="466" y="206" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >능동 부저: 전원만 주면 정해진 한 음</text><text x="466" y="228" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >  → 음 높이 조절 불가</text><text x="466" y="250" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >3핀 부저 모듈: S→GPIO27, VCC→3V3, −→GND</text><text x="900" y="140" font-size="16" fill="#1d2433" text-anchor="start" font-weight="bold" >tone(27, 주파수, 시간) = 사각파 출력</text><polyline points="1000,210 1000,170 1030.0,170 1030.0,210 1060,210 1060,170 1090.0,170 1090.0,210 1120,210 1120,170 1150.0,170 1150.0,210 1180,210 1180,170 1210.0,170 1210.0,210 1240,210" fill="none" stroke="#e08a1e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="988" y="196" font-size="14" fill="#e08a1e" text-anchor="end" font-weight="bold" >도 262Hz</text><polyline points="1000,280 1000,240 1020.0,240 1020.0,280 1040,280 1040,240 1060.0,240 1060.0,280 1080,280 1080,240 1100.0,240 1100.0,280 1120,280 1120,240 1140.0,240 1140.0,280 1160,280 1160,240 1180.0,240 1180.0,280 1200,280 1200,240 1220.0,240 1220.0,280 1240,280" fill="none" stroke="#d64545" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="988" y="266" font-size="14" fill="#d64545" text-anchor="end" font-weight="bold" >솔 392Hz</text><polyline points="1000,350 1000,310 1015.0,310 1015.0,350 1030,350 1030,310 1045.0,310 1045.0,350 1060,350 1060,310 1075.0,310 1075.0,350 1090,350 1090,310 1105.0,310 1105.0,350 1120,350 1120,310 1135.0,310 1135.0,350 1150,350 1150,310 1165.0,310 1165.0,350 1180,350 1180,310 1195.0,310 1195.0,350 1210,350 1210,310 1225.0,310 1225.0,350 1240,350" fill="none" stroke="#2e9e5b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="988" y="336" font-size="14" fill="#2e9e5b" text-anchor="end" font-weight="bold" >도 523Hz</text><text x="900" y="390" font-size="15" fill="#5b6475" text-anchor="start" font-weight="normal" >주파수 ↑ = 1초에 떨리는 횟수 ↑ = 높은 소리</text><rect x="40" y="330" width="790" height="112" rx="10" fill="#fff3e0" stroke="#f0b86d" stroke-width="1.5" /><text x="56" y="360" font-size="15" fill="#1d2433" text-anchor="start" font-weight="bold" >음계 주파수와 주의 사항</text><text x="56" y="382" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >도 262 · 레 294 · 미 330 · 파 349 · 솔 392 · 라 440 · 시 494 · 도(높은) 523  (단위 Hz)</text><text x="56" y="404" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >tone()은 소리를 켜 두고 바로 다음 줄로 넘어감 → delay()로 기다려야 음이 겹치지 않는다</text><text x="56" y="426" font-size="14" fill="#1d2433" text-anchor="start" font-weight="normal" >큰 소리 자석식 부저(30mA 이상)는 트랜지스터를 거쳐 연결 (GPIO 직접 연결 X)</text>
</svg>