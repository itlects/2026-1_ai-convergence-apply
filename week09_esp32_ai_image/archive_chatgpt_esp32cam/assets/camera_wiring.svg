<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="#f6f8fb"/><text x="35" y="50" font-family="sans-serif" font-size="32" font-weight="bold">Week09 - ESP32-CAM / OV2640 / microSD capture</text>
<text x="35" y="82" font-family="sans-serif" font-size="19">ESP32-CAM is a separate camera board; DevKitC V4 is used for Workbook 1.</text>
<rect x="80" y="170" width="240" height="320" rx="16" fill="#416073"/><text x="110" y="222" font-family="sans-serif" font-size="26" fill="white">USB-TTL</text><text x="110" y="267" font-family="sans-serif" font-size="20" fill="white">3.3V logic</text>
<rect x="725" y="150" width="370" height="420" rx="18" fill="#23755c"/><text x="760" y="210" font-family="sans-serif" font-size="29" fill="white">AI Thinker ESP32-CAM</text><rect x="800" y="255" width="190" height="125" rx="12" fill="#212a2f"/><circle cx="895" cy="319" r="43" fill="#778fa0"/><circle cx="895" cy="319" r="20" fill="#0d1620"/><text x="817" y="408" font-family="sans-serif" font-size="18" fill="white">OV2640 built in</text><text x="804" y="466" font-family="sans-serif" font-size="20" fill="white">microSD slot</text>
<g stroke-width="5" fill="none"><path d="M320 309 H725" stroke="#3176bf"/><path d="M320 350 H725" stroke="#e38e39"/><path d="M320 391 H725" stroke="#2d3439"/></g>
<g font-family="sans-serif" font-size="19"><text x="400" y="296">TXD → U0R (RX)</text><text x="400" y="337">RXD → U0T (TX)</text><text x="400" y="378">GND → GND</text><text x="380" y="435">GPIO0 ↔ GND: FLASH ONLY</text><text x="380" y="465">Remove jumper for RUN</text></g>
<rect x="77" y="526" width="390" height="92" rx="12" fill="#d8e6ed"/><text x="94" y="562" font-family="sans-serif" font-size="20">Stable regulated 5V → CAM 5V</text><text x="94" y="590" font-family="sans-serif" font-size="18">Connect common GND; avoid dual supplies</text><path d="M467 560 H725" stroke="#c63737" stroke-width="5"/>
<text x="36" y="651" font-family="sans-serif" font-size="17" fill="#a22e2e">Do not connect 5V TTL TX to 3.3V UART. No direct OV2640 wiring on standard WROOM DevKitC V4.</text>
</svg>