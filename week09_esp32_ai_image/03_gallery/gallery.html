<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week09 이미지 갤러리 및 96×96 전처리</title>
<style>
body{font:16px system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 16px}
button,input{padding:10px;margin:6px 0} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
article{border:1px solid #aaa;border-radius:10px;padding:12px;overflow-wrap:anywhere}
img{max-width:100%;image-rendering:auto} small{display:block} canvas{display:none}
</style>
</head>
<body>
<h1>9주차 AI 학습 이미지 갤러리</h1>
<p>ESP32-CAM microSD에서 복사한 JPEG 또는 예제 이미지를 선택하세요. 파일은 서버로 전송되지 않습니다.</p>
<label>이미지 선택: <input id="files" type="file" accept="image/*" multiple></label>
<button id="samples">시연용 이미지 3장 생성</button>
<button id="clear">갤러리 초기화</button>
<p id="status" role="status">이미지를 선택하면 96×96 크기로 변환합니다.</p>
<div id="gallery" class="grid"></div>
<script>
"use strict";
const files=document.getElementById("files");
const gallery=document.getElementById("gallery");
const status=document.getElementById("status");
let count=0;
function tile(blob,name){
  return new Promise((resolve,reject)=>{
    const objectUrl=URL.createObjectURL(blob);
    const image=new Image();
    image.onload=()=>{
      const canvas=document.createElement("canvas");
      canvas.width=96; canvas.height=96;
      const ctx=canvas.getContext("2d");
      // Aspect-preserving center crop to a square.
      const side=Math.min(image.naturalWidth,image.naturalHeight);
      const sx=(image.naturalWidth-side)/2;
      const sy=(image.naturalHeight-side)/2;
      ctx.drawImage(image,sx,sy,side,side,0,0,96,96);
      canvas.toBlob(result=>{
        URL.revokeObjectURL(objectUrl);
        if(!result){reject(new Error("PNG 인코딩 실패"));return;}
        const url=URL.createObjectURL(result);
        const article=document.createElement("article");
        const title=document.createElement("strong");
        title.textContent=name;
        const img=document.createElement("img");
        img.src=url; img.alt=name+" (96x96)";
        img.width=192; img.height=192;
        const info=document.createElement("small");
        info.textContent=image.naturalWidth+"×"+image.naturalHeight+
          " → 96×96 (PNG "+result.size+" bytes)";
        const a=document.createElement("a");
        a.href=url;
        a.download=name.replace(/\.[^.]+$/,"")+"_96x96.png";
        a.textContent="96×96 PNG 저장";
        article.append(title,document.createElement("hr"),img,info,a);
        gallery.append(article);
        ++count;
        status.textContent=count+"장 변환 완료";
        resolve();
      },"image/png");
    };
    image.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error(name+" 읽기 실패"));};
    image.src=objectUrl;
  });
}
files.addEventListener("change",async ()=>{
  for(const file of files.files){
    try{await tile(file,file.name);}catch(e){status.textContent=e.message;}
  }
});
document.getElementById("samples").addEventListener("click",async ()=>{
  for(let i=0;i<3;i++){
    const c=document.createElement("canvas");c.width=320;c.height=240;
    const x=c.getContext("2d");
    x.fillStyle=["#d7e8fa","#ffe5ce","#def5d5"][i];x.fillRect(0,0,320,240);
    x.fillStyle=["#2572b4","#c24c2e","#287645"][i];
    x.beginPath();x.arc(160,120,50+i*10,0,Math.PI*2);x.fill();
    x.fillStyle="#000";x.font="22px sans-serif";x.fillText("class_"+(i+1),20,32);
    const blob=await new Promise(resolve=>c.toBlob(resolve,"image/png"));
    await tile(blob,"sample_class_"+(i+1)+".png");
  }
});
document.getElementById("clear").addEventListener("click",()=>{
  for(const img of gallery.querySelectorAll("img")) URL.revokeObjectURL(img.src);
  gallery.replaceChildren();count=0;files.value="";
  status.textContent="갤러리를 초기화했습니다.";
});
</script>
</body>
</html>
