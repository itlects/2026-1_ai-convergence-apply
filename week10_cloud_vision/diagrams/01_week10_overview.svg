<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1400" height="560" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<text x="30" y="44" font-size="26" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="bold">10주차 전체 흐름 — 사전학습 API로 분류하고, 데이터를 나눠서 검증한다</text>
<text x="30" y="72" font-size="15" fill="#5b6475" xml:space="preserve" text-anchor="start" font-weight="normal">9주차: 이미지 수집 → 10주차: 분류·검증·데이터 분할 → 11주차: 직접 학습(Edge Impulse)</text>
<rect x="30" y="110" width="250" height="200" rx="10" fill="#fdf1e2" stroke="#e08a1e" stroke-width="2"/>
<text x="155.0" y="138" font-size="16" fill="#e08a1e" xml:space="preserve" text-anchor="middle" font-weight="bold">① 이미지 준비</text>
<text x="155.0" y="164" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">과일 80장 (4종 x 20)</text>
<text x="155.0" y="186" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">Drive → Colab (gdown)</text>
<text x="155.0" y="208" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">GitHub → ESP32 (HTTPS)</text>
<text x="155.0" y="230" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">9주차 촬영 사진도 가능</text>
<rect x="300" y="110" width="250" height="200" rx="10" fill="#e8f0fc" stroke="#2f6fd6" stroke-width="2"/>
<text x="425.0" y="138" font-size="16" fill="#2f6fd6" xml:space="preserve" text-anchor="middle" font-weight="bold">② Cloud Vision</text>
<text x="425.0" y="164" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">LABEL_DETECTION</text>
<text x="425.0" y="186" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">라벨 + score 여러 개</text>
<text x="425.0" y="208" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">예) Fruit 0.96</text>
<text x="425.0" y="230" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">     Apple 0.93</text>
<rect x="570" y="110" width="250" height="200" rx="10" fill="#f1ebfb" stroke="#7b4fc9" stroke-width="2"/>
<text x="695.0" y="138" font-size="16" fill="#7b4fc9" xml:space="preserve" text-anchor="middle" font-weight="bold">③ 매핑 규칙</text>
<text x="695.0" y="164" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">자유 라벨 → 4개 클래스</text>
<text x="695.0" y="186" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">키워드 표 + MIN_SCORE</text>
<text x="695.0" y="208" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">규칙은 val로 결정</text>
<text x="695.0" y="230" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">없으면 unknown</text>
<rect x="840" y="110" width="250" height="200" rx="10" fill="#e6f5ec" stroke="#2e9e5b" stroke-width="2"/>
<text x="965.0" y="138" font-size="16" fill="#2e9e5b" xml:space="preserve" text-anchor="middle" font-weight="bold">④ 평가</text>
<text x="965.0" y="164" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">정답(labels.csv)과 비교</text>
<text x="965.0" y="186" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">Accuracy = 맞힌 수/전체</text>
<text x="965.0" y="208" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">혼동행렬로 오답 분석</text>
<text x="965.0" y="230" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">score ≠ accuracy</text>
<rect x="1110" y="110" width="250" height="200" rx="10" fill="#fbe9e9" stroke="#d64545" stroke-width="2"/>
<text x="1235.0" y="138" font-size="16" fill="#d64545" xml:space="preserve" text-anchor="middle" font-weight="bold">⑤ 데이터 분할</text>
<text x="1235.0" y="164" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">train 70% 학습</text>
<text x="1235.0" y="186" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">val 15% 규칙·k 선택</text>
<text x="1235.0" y="208" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">test 15% 마지막 1회</text>
<text x="1235.0" y="230" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">클래스 비율 유지(층화)</text>
<line x1="282" y1="210" x2="296" y2="210" stroke="#1d2433" stroke-width="2" marker-end="url(#ah)"/>
<line x1="552" y1="210" x2="566" y2="210" stroke="#1d2433" stroke-width="2" marker-end="url(#ah)"/>
<line x1="822" y1="210" x2="836" y2="210" stroke="#1d2433" stroke-width="2" marker-end="url(#ah)"/>
<line x1="1092" y1="210" x2="1106" y2="210" stroke="#1d2433" stroke-width="2" marker-end="url(#ah)"/>
<rect x="30" y="350" width="1330" height="170" rx="10" fill="#fafbfc" stroke="#9aa3b2" stroke-width="1.5"/>
<text x="60" y="385" font-size="16" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="bold">실습 위치</text>
<text x="60" y="420" font-size="15" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="normal">워크북 1 (ESP32-DevKitC V4) : 예제1 회로 점검 → 예제2 Wi-Fi·HTTPS 이미지 다운로드 → 예제3 Vision 라벨 → 예제4 분류기 + LED·부저 + 정확도</text>
<text x="60" y="455" font-size="15" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="normal">워크북 2 (Colab) : 데이터 로드 → 층화 분할 → Vision 라벨(실시간 또는 캐시) → val로 매핑 규칙 선택 → test 정확도 → kNN 직접 학습과 비교</text>
<text x="60" y="490" font-size="15" fill="#2f6fd6" xml:space="preserve" text-anchor="start" font-weight="bold">연결 고리 : 워크북 2에서 정한 매핑 규칙(키워드, MIN_SCORE)을 예제4 코드에 옮겨 적고, 같은 test 12장으로 ESP32에서도 정확도를 확인한다</text>
</svg>