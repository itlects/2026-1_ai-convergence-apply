<circle cx="470" cy="430" r="10" fill="#fff" stroke="#1d2433" stroke-width="3"/>
<circle cx="470" cy="430" r="62" fill="none" stroke="#7b4fc9" stroke-width="2" stroke-dasharray="6 5"/>
<text x="470" y="360" font-size="14" fill="#7b4fc9" xml:space="preserve" text-anchor="middle" font-weight="bold">새 이미지 ? (k=5)</text>
<rect x="700" y="100" width="670" height="220" rx="10" fill="#e8f0fc" stroke="#2f6fd6" stroke-width="2"/>
<text x="1035.0" y="128" font-size="16" fill="#2f6fd6" xml:space="preserve" text-anchor="middle" font-weight="bold">학습(fit)과 예측(predict)</text>
<text x="1035.0" y="154" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">fit(train 특징, train 정답) : 특징과 정답을 기억</text>
<text x="1035.0" y="176" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">predict(새 특징) : 가장 가까운 k개를 찾아 다수결</text>
<text x="1035.0" y="198" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">k가 작으면 예민(과적합), 크면 둔감(과소적합)</text>
<text x="1035.0" y="220" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">→ k는 val 정확도로 고른다</text>
<rect x="700" y="340" width="670" height="220" rx="10" fill="#e6f5ec" stroke="#2e9e5b" stroke-width="2"/>
<text x="1035.0" y="368" font-size="16" fill="#2e9e5b" xml:space="preserve" text-anchor="middle" font-weight="bold">Cloud Vision과 비교</text>
<text x="1035.0" y="394" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">Vision: 학습 안 함, 수천 종 라벨, 인터넷·비용 필요</text>
<text x="1035.0" y="416" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">kNN: 우리 데이터로 학습, 4종만, 오프라인 무료</text>
<text x="1035.0" y="438" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">같은 test 12장으로 두 정확도를 비교</text>
<text x="1035.0" y="460" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">11주차 Edge Impulse = 더 강한 모델을 직접 학습</text>
</svg>