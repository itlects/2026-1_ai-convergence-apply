<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1400" height="600" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<text x="30" y="44" font-size="26" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="bold">kNN(k-최근접 이웃) — train 데이터로 직접 학습하는 가장 단순한 지도학습</text>
<text x="30" y="72" font-size="15" fill="#5b6475" xml:space="preserve" text-anchor="start" font-weight="normal">이미지 → 색 특징(평균 R·G·B 등) → 가장 가까운 k개 train 이미지의 정답으로 다수결</text>
<rect x="30" y="100" width="640" height="460" rx="10" fill="#fafbfc" stroke="#9aa3b2" stroke-width="1.5"/>
<line x1="80" y1="520" x2="640" y2="520" stroke="#1d2433" stroke-width="2"/>
<line x1="80" y1="520" x2="80" y2="130" stroke="#1d2433" stroke-width="2"/>
<text x="360" y="552" font-size="14" fill="#5b6475" xml:space="preserve" text-anchor="middle" font-weight="bold">특징 1: 평균 R(빨강)</text>
<text x="60" y="120" font-size="14" fill="#5b6475" xml:space="preserve" text-anchor="start" font-weight="bold">특징 2: 평균 B(파랑)</text>
