<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1400" height="760" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<text x="30" y="44" font-size="26" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="bold">ESP32에서 Cloud Vision을 호출하는 순서 (예제 2·3·4)</text>
<text x="30" y="72" font-size="15" fill="#5b6475" xml:space="preserve" text-anchor="start" font-weight="normal">DevKitC V4는 카메라가 없으므로 GitHub의 이미지를 내려받아 Base64로 바꾼 뒤 Vision에 보낸다</text>
<rect x="30" y="100" width="280" height="56" rx="10" fill="#e8f0fc" stroke="#2f6fd6" stroke-width="2"/>
<text x="170" y="135" font-size="17" fill="#2f6fd6" xml:space="preserve" text-anchor="middle" font-weight="bold">ESP32-DevKitC V4</text>
<line x1="170" y1="156" x2="170" y2="720" stroke="#2f6fd6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="480" y="100" width="280" height="56" rx="10" fill="#fdf1e2" stroke="#e08a1e" stroke-width="2"/>
<text x="620" y="135" font-size="17" fill="#e08a1e" xml:space="preserve" text-anchor="middle" font-weight="bold">GitHub (raw 이미지)</text>
<line x1="620" y1="156" x2="620" y2="720" stroke="#e08a1e" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="960" y="100" width="280" height="56" rx="10" fill="#e6f5ec" stroke="#2e9e5b" stroke-width="2"/>
<text x="1100" y="135" font-size="17" fill="#2e9e5b" xml:space="preserve" text-anchor="middle" font-weight="bold">Cloud Vision API</text>
<line x1="1100" y1="156" x2="1100" y2="720" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="170" y1="200" x2="612" y2="200" stroke="#e08a1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="391.0" y="190.0" font-size="13" fill="#e08a1e" xml:space="preserve" text-anchor="middle" font-weight="normal">① HTTPS GET  images/apple/apple_02.jpg</text>
<line x1="620" y1="250" x2="178" y2="250" stroke="#e08a1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="399.0" y="240.0" font-size="13" fill="#e08a1e" xml:space="preserve" text-anchor="middle" font-weight="normal">② 200 OK + JPEG 4,925 bytes (FF D8 FF ...)</text>
<line x1="170" y1="380" x2="1092" y2="380" stroke="#2e9e5b" stroke-width="2" marker-end="url(#ah)"/>
<text x="631.0" y="370.0" font-size="13" fill="#2e9e5b" xml:space="preserve" text-anchor="middle" font-weight="normal">④ HTTPS POST /v1/images:annotate?key=API키</text>
<line x1="1100" y1="430" x2="178" y2="430" stroke="#2e9e5b" stroke-width="2" marker-end="url(#ah)"/>
<text x="639.0" y="420.0" font-size="13" fill="#2e9e5b" xml:space="preserve" text-anchor="middle" font-weight="normal">⑤ 200 OK + JSON  labelAnnotations[]</text>
<rect x="30" y="290" width="290" height="64" rx="10" fill="#fff" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="175" y="316" font-size="14" fill="#2f6fd6" xml:space="preserve" text-anchor="middle" font-weight="bold">③ base64::encode(buf, len)</text>
<text x="175" y="340" font-size="13" fill="#5b6475" xml:space="preserve" text-anchor="middle" font-weight="normal">4,925 bytes → 6,568 글자</text>
<rect x="30" y="470" width="290" height="110" rx="10" fill="#fff" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="175" y="496" font-size="14" fill="#2f6fd6" xml:space="preserve" text-anchor="middle" font-weight="bold">⑥ ArduinoJson 해석</text>
<text x="175" y="520" font-size="13" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">description = "Apple"</text>
<text x="175" y="542" font-size="13" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">score = 0.93</text>
<text x="175" y="564" font-size="13" fill="#7b4fc9" xml:space="preserve" text-anchor="middle" font-weight="normal">→ 매핑 규칙 → 예측 클래스</text>
<rect x="30" y="600" width="290" height="90" rx="10" fill="#fff" stroke="#2f6fd6" stroke-width="1.5"/>
<text x="175" y="626" font-size="14" fill="#2f6fd6" xml:space="preserve" text-anchor="middle" font-weight="bold">⑦ 표시</text>
<text x="175" y="650" font-size="13" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">LED(예측) + 부저(정답/오답)</text>
<text x="175" y="672" font-size="13" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">시리얼: 정확도·혼동행렬</text>
<rect x="800" y="470" width="570" height="220" rx="10" fill="#f6f8fa" stroke="#9aa3b2" stroke-width="1.5"/>
<text x="820" y="498" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="bold">요청 JSON (예제3 body)</text>
<text x="820" y="528" font-size="13" fill="#3b3b3b" xml:space="preserve" text-anchor="start" font-weight="normal">{"requests":[{</text>
<text x="820" y="550" font-size="13" fill="#3b3b3b" xml:space="preserve" text-anchor="start" font-weight="normal">  "image":{"content":"/9j/4AAQ..."},</text>
<text x="820" y="572" font-size="13" fill="#3b3b3b" xml:space="preserve" text-anchor="start" font-weight="normal">  "features":[{"type":"LABEL_DETECTION",</text>
<text x="820" y="594" font-size="13" fill="#3b3b3b" xml:space="preserve" text-anchor="start" font-weight="normal">                "maxResults":5}]</text>
<text x="820" y="616" font-size="13" fill="#3b3b3b" xml:space="preserve" text-anchor="start" font-weight="normal">}]}</text>
<text x="820" y="650" font-size="13" fill="#2e9e5b" xml:space="preserve" text-anchor="start" font-weight="bold">응답: responses[0].labelAnnotations[i].description / .score</text>
<text x="820" y="674" font-size="13" fill="#d64545" xml:space="preserve" text-anchor="start" font-weight="normal">오류: error.message (예: API key not valid.)</text>
</svg>