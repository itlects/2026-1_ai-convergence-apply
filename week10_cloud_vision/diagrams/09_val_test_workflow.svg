<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<rect width="1400" height="520" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker></defs>
<text x="30" y="44" font-size="26" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="bold">검증 데이터와 시험 데이터를 쓰는 순서 — 시험 데이터는 마지막에 한 번만</text>
<text x="30" y="72" font-size="15" fill="#5b6475" xml:space="preserve" text-anchor="start" font-weight="normal">test를 보고 규칙을 고치면 test 정확도가 실제보다 좋게 나온다 (데이터 누수, 과대평가)</text>
<rect x="30" y="110" width="310" height="200" rx="10" fill="#e8f0fc" stroke="#2f6fd6" stroke-width="2"/>
<text x="185.0" y="138" font-size="16" fill="#2f6fd6" xml:space="preserve" text-anchor="middle" font-weight="bold">1. 후보 만들기</text>
<text x="185.0" y="164" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">규칙 A: 정확히 일치</text>
<text x="185.0" y="186" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">규칙 B: 키워드 표</text>
<text x="185.0" y="208" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">kNN: k = 1, 3, 5, 7</text>
<line x1="342" y1="210" x2="372" y2="210" stroke="#1d2433" stroke-width="2" marker-end="url(#ah)"/>
<rect x="375" y="110" width="310" height="200" rx="10" fill="#fdf1e2" stroke="#e08a1e" stroke-width="2"/>
<text x="530.0" y="138" font-size="16" fill="#e08a1e" xml:space="preserve" text-anchor="middle" font-weight="bold">2. val로 비교</text>
<text x="530.0" y="164" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">후보마다 val 정확도</text>
<text x="530.0" y="186" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">가장 높은 것 선택</text>
<text x="530.0" y="208" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">(동점이면 단순한 것)</text>
<line x1="687" y1="210" x2="717" y2="210" stroke="#1d2433" stroke-width="2" marker-end="url(#ah)"/>
<rect x="720" y="110" width="310" height="200" rx="10" fill="#f1ebfb" stroke="#7b4fc9" stroke-width="2"/>
<text x="875.0" y="138" font-size="16" fill="#7b4fc9" xml:space="preserve" text-anchor="middle" font-weight="bold">3. 고정</text>
<text x="875.0" y="164" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">선택한 규칙·k를 고정</text>
<text x="875.0" y="186" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">예제4 코드에 옮겨 적기</text>
<text x="875.0" y="208" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">이후 수정 금지</text>
<line x1="1032" y1="210" x2="1062" y2="210" stroke="#1d2433" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1065" y="110" width="310" height="200" rx="10" fill="#fbe9e9" stroke="#d64545" stroke-width="2"/>
<text x="1220.0" y="138" font-size="16" fill="#d64545" xml:space="preserve" text-anchor="middle" font-weight="bold">4. test로 1회 평가</text>
<text x="1220.0" y="164" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">최종 정확도 보고</text>
<text x="1220.0" y="186" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">혼동행렬로 오답 분석</text>
<text x="1220.0" y="208" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="middle" font-weight="normal">다음 개선은 새 데이터로</text>
<rect x="30" y="340" width="1340" height="140" rx="10" fill="#fbe9e9" stroke="#d64545" stroke-width="2"/>
<text x="60" y="375" font-size="16" fill="#d64545" xml:space="preserve" text-anchor="start" font-weight="bold">주의: 데이터 누수(leakage)</text>
<text x="60" y="410" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="normal">· 같은 과일을 회전시키며 찍은 사진은 서로 매우 비슷하다 → train과 test에 나뉘어 들어가면 test가 '처음 보는 문제'가 아니게 된다</text>
<text x="60" y="440" font-size="14" fill="#1d2433" xml:space="preserve" text-anchor="start" font-weight="normal">· 실제 프로젝트에서는 촬영 날짜·물체(개체) 단위로 나누는 것이 더 정직하다 (워크북 2 토론 질문)</text>
</svg>