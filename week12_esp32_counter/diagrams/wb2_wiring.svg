<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620"><rect width="980" height="620" fill="#f8fafc"/><text x="30" y="40" font-size="23" font-family="Arial">Workbook 2 — ESP32 + MAX9814 microphone + PAM8403 speaker amplifier</text><rect x="30" y="75" width="290" height="495" rx="15" fill="#dbeafe"/><text x="45" y="112" font-size="22">ESP32-DevKitC V4</text><text x="42" y="155" font-size="17">3V3</text><line x1="290" y1="148" x2="430" y2="148" stroke="red" stroke-width="4"/><text x="445" y="155" font-size="17">MAX9814 VDD + Pot end A</text><text x="42" y="195" font-size="17">GPIO35</text><line x1="290" y1="188" x2="430" y2="188" stroke="purple" stroke-width="4"/><text x="445" y="195" font-size="17">MAX9814 OUT</text><text x="42" y="235" font-size="17">GND</text><line x1="290" y1="228" x2="430" y2="228" stroke="black" stroke-width="4"/><text x="445" y="235" font-size="17">MAX9814 GND + Pot end B</text><text x="42" y="275" font-size="17">GPIO34</text><line x1="290" y1="268" x2="430" y2="268" stroke="orange" stroke-width="4"/><text x="445" y="275" font-size="17">Pot wiper</text><text x="42" y="315" font-size="17">GPIO25</text><line x1="290" y1="308" x2="430" y2="308" stroke="green" stroke-width="4"/><text x="445" y="315" font-size="17">1µF capacitor → PAM8403 LIN</text><text x="42" y="355" font-size="17">GND</text><line x1="290" y1="348" x2="430" y2="348" stroke="black" stroke-width="4"/><text x="445" y="355" font-size="17">PAM8403 signal GND</text><text x="42" y="395" font-size="17">External regulated 5V</text><line x1="290" y1="388" x2="430" y2="388" stroke="red" stroke-width="4"/><text x="445" y="395" font-size="17">PAM8403 VCC (if specified)</text><text x="42" y="435" font-size="17">PAM8403 L+ and L-</text><line x1="290" y1="428" x2="430" y2="428" stroke="blue" stroke-width="4"/><text x="445" y="435" font-size="17">8Ω speaker (NOT GND)</text><text x="42" y="475" font-size="17">GPIO18</text><line x1="290" y1="468" x2="430" y2="468" stroke="blue" stroke-width="4"/><text x="445" y="475" font-size="17">Reset button → GND</text><text x="42" y="515" font-size="17">GPIO23</text><line x1="290" y1="508" x2="430" y2="508" stroke="green" stroke-width="4"/><text x="445" y="515" font-size="17">220Ω → LED → GND</text><text x="30" y="605" font-size="14">Speaker must use amplifier; no GPIO speaker load. Common ground for signal.</text></svg>